<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1f3a" />
    <meta
      name="description"
      content="AegisKey — your keys to a safer digital life. A self-hosted personal vault."
    />
    <link rel="icon" type="image/svg+xml" href="assets/mark.svg" />
    <link rel="stylesheet" href="css/app.css" />
    <title>AegisKey · Your personal vault</title>
    <script src="config.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to content</a>
    <div id="app">
      <div class="boot">
        <img src="assets/mark.svg" width="52" height="52" alt="" />
        <p>Opening AegisKey…</p>
      </div>
    </div>
    <div
      id="toasts"
      class="toasts"
      role="status"
      aria-live="polite"
      aria-atomic="false"
    ></div>
    <dialog id="modal" aria-labelledby="modal-title"></dialog>
    <noscript
      ><p class="noscript">
        AegisKey needs JavaScript to open your vault. Please enable it in your
        browser.
      </p></noscript
    >
  </body>
</html>
