<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../images/logo.ico">
    <link rel="stylesheet" href="styless.css">
    <title>AegisKey</title>
    <script src="auth.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="left-side-frame">
            <div class="left-inside-frame">
                <div class="left-inside-logo">
                    <img src="../../images/full_logo_wit.png" alt="Company logo" width="350" height="auto"></div>
                        <div class="left-inside-menu-selection">
                            <div><img src="../../images/home_wit.svg" alt="" width="24" height="24"><p>Vault</p></div>
                            <div><img src="../../images/passwords_wit.svg" alt="" width="24" height="24"><p>Passwords</p></div>
                            <div><img src="../../images/notes_wit.svg" alt="" width="24" height="24"><p>Secure Notes</p></div>
                            <div><img src="../../images/identities_wit.svg" alt="" width="24" height="24"><p>Identities</p></div>
                            <div><img src="../../images/generator_wit.svg" alt="" width="24" height="24"><p>Generator</p></div>
                            <div><img src="../../images/setting_wit.svg" alt="" width="24" height="24"><p>Settings</p></div>
            </div>
        </div>
        <div class="right-side-frame">
            <div class="right-inside-frame"></div>
                <div class="right-inside-searchbar-top">
                    <input type="search" id="item-search" name="item-search" placeholder="Search your vault">
                    <input type="submit" id="new-item" name="new-item" value="+ Nieuw Item">
                </div>
            <div class="right-inside-main-data">f</div>
        </div>
    </div>

</html>
